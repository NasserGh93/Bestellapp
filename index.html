<!-- @format -->

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BurgerHouse – Bestellapp</title>

    <link rel="icon" type="image/png" href="./assets/icons/logo_burger.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
  </head>

  <body>
    <header class="page-header">
      <nav class="navbar">
        <img
          class="nav-logo"
          src="./assets/icons/Logo 01.png"
          alt="Bestellapp Logo" />

        <button class="burger-menu" type="button" aria-label="Menü öffnen">
          <img class="burger-menu-icon" src="./assets/icons/menu.svg" alt="" />
        </button>
      </nav>
    </header>

    <section class="hero">
      <img
        class="hero-img"
        src="./assets/img/header_photo.png"
        alt="Restaurant Titelbild" />

      <div class="restaurant-logo-circle">
        <img
          class="restaurant-logo"
          src="./assets/icons/logo_burger.png"
          alt="BurgerHouse Logo" />
      </div>
    </section>

    <section class="restaurant-header-info">
      <div class="restaurant-title-row">
        <h1><span class="highlight-span">Burger</span>House</h1>

        <div class="rating-stars">
          <img src="./assets/icons/star.png" alt="Stern" />

          <div class="rating-value">
            <strong>4,1</strong>
            <span class="review-count">(317)</span>
          </div>
        </div>
      </div>

      <p class="restaurant-subtitle">
        The best of Burgers, Pizza, and Greens, all in one great place.
      </p>
    </section>

    <main class="main-layout">
      <nav id="category-nav" class="category-nav" aria-label="Kategorien"></nav>

      <section class="order-layout">
        <div id="menu" class="menu-container"></div>

        <aside class="basket-wrapper">
          <div class="basket">
            <h2>Your Basket</h2>

            <div id="basket-content"></div>
          </div>
        </aside>
      </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
      <button class="mobile-nav-button" type="button" aria-label="Startseite">
        <img class="mobile-nav-icon" src="./assets/icons/Home.svg" alt="" />
      </button>

      <button class="mobile-nav-button" type="button" aria-label="Profil">
        <img class="mobile-nav-icon" src="./assets/icons/Profile.svg" alt="" />
      </button>

      <button class="mobile-nav-button" type="button" aria-label="Bestellungen">
        <img class="mobile-nav-icon" src="./assets/icons/menu.svg" alt="" />
      </button>

      <button
        id="mobile-basket-toggle"
        class="mobile-nav-button mobile-basket-button"
        type="button"
        aria-label="Warenkorb öffnen">
        <img
          class="mobile-nav-icon"
          src="./assets/icons/basket-mobile-clean.svg"
          alt="" />
        <span id="mobile-basket-count" class="mobile-basket-count">0</span>
      </button>
    </nav>

    <div
      id="mobile-basket-dialog"
      class="mobile-basket-dialog"
      aria-modal="true"
      role="dialog"
      aria-hidden="true">
      <div class="mobile-basket-panel">
        <button
          class="mobile-basket-close"
          type="button"
          aria-label="Warenkorb schließen">
          ×
        </button>
        <div id="mobile-basket-content"></div>
      </div>
    </div>

    <div
      id="order-confirmation-modal"
      class="order-confirmation-modal"
      aria-live="polite"
      aria-modal="true"
      role="dialog">
      <div class="order-confirmation-dialog">
        <button
          class="order-confirmation-close"
          type="button"
          aria-label="Close confirmation">
          ×
        </button>
        <img
          class="order-confirmation-image"
          src="./assets/icons/ChatGPT%20Image%20Nov%2024,%202025,%2011_51_33%20AM%201.svg"
          alt="ChatGPT illustration" />
        <p class="order-confirmation-text">
          <span>Order Confirmed!</span>
          <span>Your Food is on the Way!</span>
        </p>
      </div>
    </div>

    <footer class="page-footer">
      <div class="footer-content">
        <span>© 2026 BurgerHouse</span>
        <span>Imprint</span>
        <span>Cookie Preferences</span>
      </div>
    </footer>

    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/basket.js"></script>
    <script src="./scripts/script.js"></script>
  </body>
</html>
